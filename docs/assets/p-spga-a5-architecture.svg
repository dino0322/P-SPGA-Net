<text x="60" y="1414" font-family="Arial, sans-serif" font-size="19" fill="#52647b" text-anchor="start" font-weight="400">Shown: A5 in main_ablation.py. C=256, H=W=7 for 224×224 input. The released training loop uses α=0.5.</text>
